# Непрерывная интеграция: линтеры -> тесты с покрытием и UI-тесты ->
# сводный отчёт о тестировании -> сборка артефакта.
# Запускается при каждом push и при каждом pull request в main/develop.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    name: lint
    runs-on: windows-latest   # WPF собирается только под Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Восстановление зависимостей
        run: dotnet restore

      - name: Проверка форматирования (whitespace)
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Проверка стиля кода (правила .editorconfig)
        run: dotnet format style --verify-no-changes --no-restore --severity warn

      - name: Сборка с анализаторами (Roslyn + StyleCop)
        shell: bash
        run: dotnet build --no-restore -c Release -clp:NoSummary 2>&1 | tee build.log

      - name: Сводка предупреждений анализаторов
        if: always()
        shell: bash
        run: |
          count=$( (grep -oE '[^ ]+\([0-9]+,[0-9]+\): warning [A-Z]+[0-9]+' build.log 2>/dev/null || true) | sort -u | wc -l)
          echo "### Предупреждения анализаторов: $count" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # UI-тесты (Category=UI) запускаются отдельной задачей ui-test.
      - name: Модульные и интеграционные тесты с покрытием
        run: dotnet test -c Release --filter "Category!=UI" --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Отчёт о покрытии кода
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub;Badges

      - name: Покрытие в сводке запуска
        if: always()
        shell: bash
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Сохранение результатов тестов и отчёта о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coveragereport

  ui-test:
    name: ui-test
    needs: lint
    runs-on: windows-latest   # раннер Windows с рабочим столом: FlaUI управляет окнами приложения
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Сборка приложения и UI-тестов
        run: dotnet build tests/Parking.UiTests -c Release

      - name: Автоматизированные тесты от лица пользователя (FlaUI)
        env:
          UI_SCREENSHOTS_DIR: ${{ github.workspace }}\TestResults\screenshots
        run: dotnet test tests/Parking.UiTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Сохранение результатов и снимков экрана
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: TestResults

  report:
    name: report
    needs: [test, ui-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Загрузка результатов всех тестов
        uses: actions/download-artifact@v4
        with:
          pattern: '*test-results'
          path: results

      - name: Сводный отчёт о тестировании
        run: >
          python3 scripts/test_report.py
          --results results --sources tests --tasks tests/tasks.json
          --out test-report/test-report.md --summary "$GITHUB_STEP_SUMMARY"

      - name: Сохранение отчёта
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report

  build:
    name: build
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Публикация приложения
        run: dotnet publish src/ParkingManager/ParkingManager.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ParkingManager-${{ github.sha }}
          path: publish
